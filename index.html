<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ensemble Park #2</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: white;
    overflow-x: hidden;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  #container {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 200px 20px;
    box-sizing: border-box;
  }

  .text-block {
    font-size: 78px;
    line-height: 1.05;
    word-break: break-word;
    overflow-wrap: anywhere;
    margin-bottom: 0.6em;
  }

  .text-block a,
  .text-block a:visited {
    color: blue;
    text-decoration: underline;
  }

  .spacer {
    height: 1em;
  }

  .image-wrap {
    width: 100vw;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    margin: 60px 0;
  }

  .image-inner {
    width: 260px;
  }

  .image-inner img {
    display: block;
    width: 100%;
    height: auto;
  }

  .image-left {
    margin-left: 0;
    margin-right: auto;
  }

  .image-right {
    margin-left: auto;
    margin-right: 0;
  }
</style>
</head>

<body>

<div id="container"></div>

<script src="the-data.js"></script>

<script>
const container = document.getElementById("container");

let imageIndex = 0;
let nextSide = "left";

function nextImageSrc() {
  const MAX = 60;
  const num = String(imageIndex % MAX).padStart(3, "0");
  imageIndex += 1;
  return `tiles/tile_${num}.webp`;
}

function getAlternatingSide() {
  const side = nextSide;
  nextSide = nextSide === "left" ? "right" : "left";
  return side;
}

function addTextBlock(html) {
  const div = document.createElement("div");
  div.className = "text-block";
  div.innerHTML = html;
  container.appendChild(div);
}

function addSpacer(lines) {
  for (let i = 0; i < lines; i++) {
    const s = document.createElement("div");
    s.className = "spacer";
    container.appendChild(s);
  }
}

function addImage(side) {
  const wrap = document.createElement("div");
  wrap.className = "image-wrap";

  const inner = document.createElement("div");
  inner.className = `image-inner image-${side}`;

  const push = Math.pow(Math.random(), 1.5) * 100;

  if (side === "left") {
    inner.style.transform = `translateX(-${push}px)`;
  } else {
    inner.style.transform = `translateX(${push}px)`;
  }

  const img = document.createElement("img");
  img.src = nextImageSrc();
  img.alt = "";

  inner.appendChild(img);
  wrap.appendChild(inner);
  container.appendChild(wrap);
}

function render(text) {
  const tokenRegex = /(<break\d+>|<image>|<l>|<r>)/g;
  const parts = text.split(tokenRegex);

  for (const partRaw of parts) {
    if (!partRaw) continue;

    const part = partRaw.trim();
    if (!part) continue;

    if (/^<break\d+>$/.test(part)) {
      const n = parseInt(part.replace(/\D/g, ""), 10) || 1;
      addSpacer(n);
    } else if (part === "<image>") {
      addImage(getAlternatingSide());
    } else if (part === "<l>") {
      addImage("left");
    } else if (part === "<r>") {
      addImage("right");
    } else {
      addTextBlock(partRaw.trim());
    }
  }
}

render(STORY_TEXT);

// prevent text dragging (except links)
document.addEventListener("mousedown", function (e) {
  if (e.target.closest(".text-block") && !e.target.closest("a")) {
    e.preventDefault();
  }
});

document.addEventListener("selectstart", function (e) {
  if (e.target.closest(".text-block") && !e.target.closest("a")) {
    e.preventDefault();
  }
});
</script>

</body>
</html>
