<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: white;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  #scroll-panel {
    position: fixed;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: auto;
    touch-action: none;
    box-sizing: border-box;
  }

  #scroll-panel::-webkit-scrollbar {
    width: 0;
    height: 0;
    display: none;
  }

  #container {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 200px 20px;
    box-sizing: border-box;
  }

  .text-block {
    font-size: 78px;
    line-height: 1.05;
    word-break: break-word;
    overflow-wrap: anywhere;
    margin-bottom: 0.6em;
  }

  .text-block a,
  .text-block a:visited {
    color: blue;
    text-decoration: underline;
    pointer-events: auto;
    touch-action: manipulation;
  }

  .spacer {
    height: 1em;
  }

  .image-wrap {
    width: 100vw;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    margin: 60px 0;
  }

  .image-inner {
    width: 260px;
  }

  .image-inner img {
    display: block;
    width: 100%;
    height: auto;
  }

  .image-left {
    margin-left: 0;
    margin-right: auto;
  }

  .image-right {
    margin-left: auto;
    margin-right: 0;
  }

  @media (pointer: coarse) {
    #scroll-panel {
      touch-action: none;
      -webkit-overflow-scrolling: auto;
    }

    .text-block a {
      touch-action: manipulation;
    }
  }
</style>
</head>

<body>

<div id="scroll-panel">
  <div id="container"></div>
</div>

<script src="the-data.js"></script>

<script>
const scrollPanel = document.getElementById("scroll-panel");
const container = document.getElementById("container");

let imageIndex = 0;
let nextSide = "left";
const activeTouches = new Map();

function nextImageSrc() {
  const MAX = 60;
  const num = String(imageIndex % MAX).padStart(3, "0");
  imageIndex += 1;
  return `tiles/tile_${num}.webp`;
}

function getAlternatingSide() {
  const side = nextSide;
  nextSide = nextSide === "left" ? "right" : "left";
  return side;
}

function addTextBlock(html) {
  const div = document.createElement("div");
  div.className = "text-block";
  div.innerHTML = html;
  container.appendChild(div);
}

function addSpacer(lines) {
  for (let i = 0; i < lines; i++) {
    const s = document.createElement("div");
    s.className = "spacer";
    container.appendChild(s);
  }
}

function addImage(side) {
  const wrap = document.createElement("div");
  wrap.className = "image-wrap";

  const inner = document.createElement("div");
  inner.className = `image-inner image-${side}`;

  const push = Math.pow(Math.random(), 1.5) * 100;

  if (side === "left") {
    inner.style.transform = `translateX(-${push}px)`;
  } else {
    inner.style.transform = `translateX(${push}px)`;
  }

  const img = document.createElement("img");
  img.src = nextImageSrc();
  img.alt = "";

  inner.appendChild(img);
  wrap.appendChild(inner);
  container.appendChild(wrap);
}

function render(text) {
  const tokenRegex = /(<break\d+>|<image>|<l>|<r>)/g;
  const parts = text.split(tokenRegex);

  for (const partRaw of parts) {
    if (!partRaw) continue;

    const part = partRaw.trim();
    if (!part) continue;

    if (/^<break\d+>$/.test(part)) {
      const n = parseInt(part.replace(/\D/g, ""), 10) || 1;
      addSpacer(n);
    } else if (part === "<image>") {
      addImage(getAlternatingSide());
    } else if (part === "<l>") {
      addImage("left");
    } else if (part === "<r>") {
      addImage("right");
    } else {
      addTextBlock(partRaw.trim());
    }
  }
}

render(STORY_TEXT);


// --------------------------------------------------
// SCROLL TUNING
// wheel stays about where it was
// trackpad gets boosted so it feels closer to wheel
// --------------------------------------------------

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function maxScrollTop() {
  return Math.max(0, scrollPanel.scrollHeight - scrollPanel.clientHeight);
}

const WHEEL_SPEED = 0.82;
const TRACKPAD_SPEED = 2.15;
const TRACKPAD_SMOOTHING = 0.72;
const TOUCH_SPEED = 0.55;
const KEY_SPEED = 0.86;

let wheelTarget = 0;
let wheelAnimating = false;
let lastWheelTime = 0;

function isLikelyTrackpad(e) {
  const absX = Math.abs(e.deltaX);
  const absY = Math.abs(e.deltaY);
  const maxDelta = Math.max(absX, absY);

  if (e.deltaMode !== 0) return false;
  if (absX > 0) return true;
  if (!Number.isInteger(e.deltaY)) return true;
  if (maxDelta > 0 && maxDelta < 18) return true;

  const now = performance.now();
  const dt = now - lastWheelTime;
  lastWheelTime = now;

  if (dt < 18 && maxDelta < 40) return true;
  return false;
}


// --------------------------------------------------
// STOP ON LAST IMAGE IN A CONSECUTIVE IMAGE RUN
// --------------------------------------------------

let stopPoints = [];
let lockedStopIndex = -1;
let snapCooldownUntil = 0;

function collectStopPoints() {
  const allImages = Array.from(document.querySelectorAll(".image-wrap"));
  stopPoints = [];

  for (let i = 0; i < allImages.length; i++) {
    const current = allImages[i];
    const next = allImages[i + 1];

    const stopY = clamp(
      Math.round(current.offsetTop + current.offsetHeight - scrollPanel.clientHeight),
      0,
      maxScrollTop()
    );

    const currentIsFollowedByImage =
      next &&
      next.classList.contains("image-wrap") &&
      next.previousElementSibling === current;

    if (!currentIsFollowedByImage) {
      stopPoints.push({
        el: current,
        y: stopY
      });
    }
  }
}

function releaseLockIfNeeded(currentTop) {
  if (lockedStopIndex === -1) return;

  const lockedY = stopPoints[lockedStopIndex]?.y;
  if (lockedY == null) {
    lockedStopIndex = -1;
    return;
  }

  if (currentTop < lockedY - 50 || currentTop > lockedY + 90) {
    lockedStopIndex = -1;
  }
}

function maybeArrestTarget(fromTop, toTop) {
  const now = performance.now();
  if (now < snapCooldownUntil) return toTop;

  releaseLockIfNeeded(fromTop);

  if (toTop <= fromTop) return toTop;

  for (let i = 0; i < stopPoints.length; i++) {
    if (i === lockedStopIndex) continue;

    const stopY = stopPoints[i].y;

    if (fromTop < stopY && toTop >= stopY) {
      lockedStopIndex = i;
      snapCooldownUntil = now + 140;
      return stopY;
    }
  }

  return toTop;
}


// --------------------------------------------------
// TRACKPAD ANIMATION
// --------------------------------------------------

function animateTrackpadScroll() {
  wheelAnimating = true;

  const current = scrollPanel.scrollTop;
  const diff = wheelTarget - current;

  if (Math.abs(diff) < 0.5) {
    scrollPanel.scrollTop = wheelTarget;
    wheelAnimating = false;
    return;
  }

  scrollPanel.scrollTop = current + diff * TRACKPAD_SMOOTHING;
  requestAnimationFrame(animateTrackpadScroll);
}

function nudgeTrackpadTarget(delta) {
  const base = wheelAnimating ? wheelTarget : scrollPanel.scrollTop;
  let nextTop = clamp(base + delta, 0, maxScrollTop());
  nextTop = maybeArrestTarget(base, nextTop);
  wheelTarget = nextTop;

  if (!wheelAnimating) {
    animateTrackpadScroll();
  }
}


// --------------------------------------------------
// WHEEL / TRACKPAD
// --------------------------------------------------

document.addEventListener("wheel", function (e) {
  const link = e.target.closest("a");
  if (link) return;

  e.preventDefault();

  if (isLikelyTrackpad(e)) {
    nudgeTrackpadTarget(e.deltaY * TRACKPAD_SPEED);
    return;
  }

  const current = scrollPanel.scrollTop;
  let nextTop = clamp(
    current + e.deltaY * WHEEL_SPEED,
    0,
    maxScrollTop()
  );

  nextTop = maybeArrestTarget(current, nextTop);

  scrollPanel.scrollTo({
    top: nextTop,
    behavior: "smooth"
  });
}, { passive: false });


// --------------------------------------------------
// TOUCH
// --------------------------------------------------

document.addEventListener("touchstart", function (e) {
  const link = e.target.closest("a");
  if (link) return;

  const touch = e.changedTouches[0];
  if (!touch) return;

  activeTouches.set(touch.identifier, {
    lastY: touch.clientY
  });

  e.preventDefault();
}, { passive: false });

document.addEventListener("touchmove", function (e) {
  let handled = false;

  for (const touch of e.changedTouches) {
    const state = activeTouches.get(touch.identifier);
    if (!state) continue;

    const dy = state.lastY - touch.clientY;
    state.lastY = touch.clientY;

    const current = scrollPanel.scrollTop;
    let nextTop = clamp(
      current + dy * TOUCH_SPEED,
      0,
      maxScrollTop()
    );

    nextTop = maybeArrestTarget(current, nextTop);

    scrollPanel.scrollTop = nextTop;
    handled = true;
  }

  if (handled) e.preventDefault();
}, { passive: false });

document.addEventListener("touchend", function (e) {
  for (const touch of e.changedTouches) {
    activeTouches.delete(touch.identifier);
  }
}, { passive: false });

document.addEventListener("touchcancel", function (e) {
  for (const touch of e.changedTouches) {
    activeTouches.delete(touch.identifier);
  }
}, { passive: false });


// --------------------------------------------------
// KEYBOARD
// --------------------------------------------------

document.addEventListener("keydown", function (e) {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;

  let delta = null;

  if (e.key === "ArrowDown") delta = 80 * KEY_SPEED;
  if (e.key === "ArrowUp") delta = -80 * KEY_SPEED;
  if (e.key === "PageDown") delta = scrollPanel.clientHeight * 0.72 * KEY_SPEED;
  if (e.key === "PageUp") delta = -scrollPanel.clientHeight * 0.72 * KEY_SPEED;
  if (e.key === " ") delta = scrollPanel.clientHeight * (e.shiftKey ? -0.72 : 0.72) * KEY_SPEED;
  if (e.key === "Home") delta = -Infinity;
  if (e.key === "End") delta = Infinity;

  if (delta === null) return;

  e.preventDefault();

  if (delta === -Infinity) {
    scrollPanel.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  if (delta === Infinity) {
    scrollPanel.scrollTo({ top: maxScrollTop(), behavior: "smooth" });
    return;
  }

  const current = scrollPanel.scrollTop;
  let nextTop = clamp(
    current + delta,
    0,
    maxScrollTop()
  );

  nextTop = maybeArrestTarget(current, nextTop);

  scrollPanel.scrollTo({
    top: nextTop,
    behavior: "smooth"
  });
}, { passive: false });


// --------------------------------------------------
// MISC
// --------------------------------------------------

window.addEventListener("resize", function () {
  collectStopPoints();
  wheelTarget = clamp(scrollPanel.scrollTop, 0, maxScrollTop());
});

document.addEventListener("mousedown", function (e) {
  if (e.target.closest(".text-block") && !e.target.closest("a")) {
    e.preventDefault();
  }
});

document.addEventListener("selectstart", function (e) {
  if (e.target.closest(".text-block") && !e.target.closest("a")) {
    e.preventDefault();
  }
});

window.addEventListener("load", function () {
  collectStopPoints();
  wheelTarget = scrollPanel.scrollTop;
});

document.querySelectorAll(".image-wrap img").forEach((img) => {
  if (!img.complete) {
    img.addEventListener("load", function () {
      collectStopPoints();
      wheelTarget = clamp(scrollPanel.scrollTop, 0, maxScrollTop());
    });
  }
});

collectStopPoints();
wheelTarget = scrollPanel.scrollTop;
</script>

</body>
</html>
